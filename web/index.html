<!doctype html>
<html lang="zh-CN" data-theme="cauldron">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>造化乾坤鼎 · 工作台</title>
  <link rel="stylesheet" href="./theme.css" />
</head>
<body>
  <div class="shell">
    <header class="ears">
      <div class="brand">
        <h1>造化乾坤鼎</h1>
        <span class="seal">工作台</span>
      </div>
      <div class="status">
        <span>引擎 <b id="engine-version">—</b></span>
        <span>已加载 <b id="snapshot-at">—</b></span>
        <span>产品 <b id="product-count">—</b></span>
        <button class="theme-toggle" id="theme-toggle" type="button">宣纸</button>
      </div>
    </header>

    <main class="tripod">
      <section class="leg" id="leg-engine">
        <h2 class="leg-title">造化鼎 <small>ENGINE</small></h2>
        <div class="card">
          <h3>引擎状态</h3>
          <dl class="kv">
            <dt>版本</dt><dd id="k-engine-version">—</dd>
            <dt>快照时间</dt><dd id="k-generated-at">—</dd>
            <dt>快照格式</dt><dd id="k-schema">—</dd>
          </dl>
        </div>
        <div class="card">
          <h3>能力入口</h3>
          <p class="mono">造技能 / 融合 / 打包 / 安装 / 评估 / 体检</p>
        </div>
      </section>

      <section class="leg" id="leg-products">
        <h2 class="leg-title">乾坤鼎 <small>PRODUCTS</small></h2>
        <div id="product-list"></div>
        <div class="empty" id="product-empty" hidden>还没有产品快照。运行 <span class="mono">zhaohua export</span> 生成 snapshot.json。</div>
      </section>

      <section class="leg" id="leg-combo">
        <h2 class="leg-title">组合 <small>COMPOSE</small></h2>
        <div class="empty">
          尚未装配<br />
          <span class="mono">等待第二级产品接入</span>
        </div>
      </section>
    </main>
  </div>

  <div class="ember"><i></i><span id="ember-text">只读快照 · 不会改动任何文件</span></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
