<!-- ============================================================
     造化乾坤鼎 · 常驻切换（pill）
     乾坤鼎界面右下角常驻一个「造化鼎」入口；点一下进造化鼎，Esc/按钮回来。
     只用同源跳转，不改任何 chunk。
     ============================================================ -->
<div id="cauldron-switch" role="button" tabindex="0" title="打开造化鼎（Alt+Z）">
  <span class="cs-dot"></span><span class="cs-t">造化鼎</span>
</div>
<style>
  #cauldron-switch {
    position: fixed; right: 16px; bottom: 16px; z-index: 8990;
    display: flex; align-items: center; gap: 7px;
    padding: 8px 13px; border-radius: 999px;
    background: rgba(18, 22, 28, .86); color: #c9b489;
    border: 1px solid #3a3427;
    font: 12px/1.4 -apple-system, "Microsoft YaHei", sans-serif;
    letter-spacing: .06em; cursor: pointer;
    backdrop-filter: blur(6px);
    opacity: .55; transition: opacity .18s ease, border-color .18s ease, transform .18s ease;
  }
  #cauldron-switch:hover { opacity: 1; border-color: #6b5c3a; transform: translateY(-1px); }
  #cauldron-switch .cs-dot { width: 6px; height: 6px; border-radius: 50%; background: #d8b26a; box-shadow: 0 0 8px #d8b26a88; }
</style>
<script>
  (function () {
    var el = document.getElementById('cauldron-switch');
    if (!el || el.dataset.ready) return;
    el.dataset.ready = '1';
    function open() { location.href = '/zhaohua/index.html'; }
    el.addEventListener('click', open);
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    document.addEventListener('keydown', function (e) { if (e.altKey && (e.key === 'z' || e.key === 'Z')) open(); });
  })();
</script>
