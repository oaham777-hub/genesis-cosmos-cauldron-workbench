<!-- ============================================================
     造化乾坤鼎 · 启动覆盖层（launcher）
     由 patch\apply.ps1 -Overlay 注入到 views\mainview\index.html
     幂等标记：id="cauldron-launcher"
     行为：选「工作台」→ 移除本层，露出原欢迎页；选「造化鼎」→ 派发事件（P2 接入）
     ============================================================ -->
<div id="cauldron-launcher" role="dialog" aria-modal="true" aria-label="选择工作台">
  <style>
    #cauldron-launcher {
      position: fixed; inset: 0; z-index: 2147483000;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(120% 120% at 50% 0%, #12232b 0%, #0a0d10 60%, #06080a 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #e8eef2;
      animation: cl-fade .35s ease both;
    }
    #cauldron-launcher .cl-card { width: min(560px, 86vw); text-align: center; }
    #cauldron-launcher .cl-kicker {
      font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
      color: #6f8794; margin-bottom: 18px;
    }
    #cauldron-launcher h1 {
      font-size: 30px; line-height: 1.3; font-weight: 600; margin: 0 0 10px;
      letter-spacing: .02em;
    }
    #cauldron-launcher p.cl-sub { font-size: 13px; color: #8a9ba6; margin: 0 0 34px; }
    #cauldron-launcher .cl-actions { display: flex; gap: 14px; justify-content: center; }
    #cauldron-launcher button {
      flex: 1 1 0; min-width: 168px; cursor: pointer;
      padding: 16px 20px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.04); color: #e8eef2;
      font-size: 15px; font-weight: 500; font-family: inherit;
      transition: background .18s, border-color .18s, transform .12s;
    }
    #cauldron-launcher button:hover { background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.26); }
    #cauldron-launcher button:active { transform: translateY(1px); }
    #cauldron-launcher button.cl-primary {
      background: #e8eef2; color: #0b1114; border-color: transparent;
    }
    #cauldron-launcher button.cl-primary:hover { background: #fff; }
    #cauldron-launcher .cl-hint { margin-top: 22px; font-size: 12px; color: #5f7480; }
    #cauldron-launcher .cl-hint kbd {
      font-family: inherit; font-size: 11px; padding: 1px 5px; border-radius: 4px;
      border: 1px solid rgba(255,255,255,.18); color: #8a9ba6;
    }
    #cauldron-launcher .cl-toast {
      margin-top: 16px; min-height: 18px; font-size: 12px; color: #c9a227;
      opacity: 0; transition: opacity .2s;
    }
    #cauldron-launcher .cl-toast.cl-show { opacity: 1; }
    @keyframes cl-fade { from { opacity: 0 } to { opacity: 1 } }
  </style>

  <div class="cl-card">
    <div class="cl-kicker">ZAOHUA CAULDRON</div>
    <h1>造化乾坤鼎</h1>
    <p class="cl-sub">选一个入口开始。乾坤鼎与造化鼎共用同一套技能与资产。</p>

    <div class="cl-actions">
      <button type="button" class="cl-primary" data-cl="studio">乾坤鼎</button>
      <button type="button" data-cl="zhaohua">造化鼎</button>
    </div>

    <div class="cl-toast" id="cl-toast" role="status" aria-live="polite"></div>
    <div class="cl-hint">按 <kbd>1</kbd> 进入乾坤鼎 · 按 <kbd>2</kbd> 打开造化鼎 · 按 <kbd>Esc</kbd> 关闭本层</div>
  </div>

  <script>
    (function () {
      var root = document.getElementById('cauldron-launcher');
      if (!root || root.dataset.clReady === '1') return;
      root.dataset.clReady = '1';

      var toast = document.getElementById('cl-toast');
      function say(msg) {
        if (!toast) return;
        toast.textContent = msg;
        toast.classList.add('cl-show');
        setTimeout(function () { toast.classList.remove('cl-show'); }, 2400);
      }

      function dismiss() {
        root.style.transition = 'opacity .22s ease';
        root.style.opacity = '0';
        setTimeout(function () { root.remove(); }, 220);
      }

      function openZhaohua() {
        // 造化鼎是同源页面：直接在主窗口内跳转，返回时走 / 回到乾坤鼎
        say('正在打开造化鼎…');
        location.href = '/zhaohua/index.html';
      }

      root.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-cl]');
        if (!btn) return;
        if (btn.dataset.cl === 'studio') dismiss();
        else if (btn.dataset.cl === 'zhaohua') openZhaohua();
      });

      document.addEventListener('keydown', function (e) {
        if (!document.body.contains(root)) return;
        if (e.key === '1') { e.preventDefault(); dismiss(); }
        else if (e.key === '2') { e.preventDefault(); openZhaohua(); }
        else if (e.key === 'Escape') { e.preventDefault(); dismiss(); }
      });
    })();
  </script>
</div>
